    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <script>
        // Configuration. The admin password is NOT stored here: it is entered at
        // sign-in and checked by the API on every request.
        const CONFIG = {
            API_ENDPOINT: 'https://p52pxaqka1.execute-api.eu-north-1.amazonaws.com/prod',
            STORAGE_KEY: 'dashfiles-admin-token',
            THEME_KEY: 'dashfiles-admin-theme',
            DELETE_CONCURRENCY: 4
        };

        const CATEGORIES = {
            image: { label: 'Images', short: 'IMG' },
            video: { label: 'Videos', short: 'VID' },
            audio: { label: 'Audio', short: 'AUD' },
            document: { label: 'Documents', short: 'DOC' },
            other: { label: 'Other', short: 'FILE' }
        };

        const ICONS = {
            view: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
            copy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
            download: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
            more: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>',
            delete: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
        };

        // ---------- State ----------

        const state = {
            password: null,
            files: [],
            filtered: [],
            selected: new Set(),
            sort: { field: 'uploadDate', direction: 'desc' },
            page: 1,
            pageSize: 50,
            bucketSize: null,
            loading: false
        };

        const $ = (id) => document.getElementById(id);

        // ---------- Utilities ----------

        // Every user-controlled value (file names, IDs, content types) goes through
        // this before reaching innerHTML: file names come straight from uploaders.
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes <= 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.min(Math.floor(Math.log(bytes) / Math.log(k)), sizes.length - 1);
            return parseFloat((bytes / Math.pow(k, i)).toFixed(i === 0 ? 0 : 1)) + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            if (!dateString) return 'Unknown';
            const date = new Date(dateString);
            if (isNaN(date)) return 'Unknown';
            return date.toLocaleString(undefined, {
                day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        function formatRelative(dateString) {
            if (!dateString) return '';
            const diff = (Date.now() - new Date(dateString).getTime()) / 1000;
            if (isNaN(diff)) return '';
            const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
            const steps = [[60, 'second'], [3600, 'minute'], [86400, 'hour'], [604800, 'day'], [2629800, 'week'], [31557600, 'month'], [Infinity, 'year']];
            const divisors = { second: 1, minute: 60, hour: 3600, day: 86400, week: 604800, month: 2629800, year: 31557600 };
            for (const [limit, unit] of steps) {
                if (Math.abs(diff) < limit) return rtf.format(-Math.round(diff / divisors[unit]), unit);
            }
            return '';
        }

        function getFileCategory(contentType) {
            if (!contentType) return 'other';
            if (contentType.startsWith('image/')) return 'image';
            if (contentType.startsWith('video/')) return 'video';
            if (contentType.startsWith('audio/')) return 'audio';
            if (contentType.includes('pdf') || contentType.includes('document') || contentType.includes('text') ||
                contentType.includes('sheet') || contentType.includes('presentation') || contentType.includes('msword')) return 'document';
            return 'other';
        }

        function getExtension(name) {
            const match = /\.([a-z0-9]{1,5})$/i.exec(name || '');
            return match ? match[1] : null;
        }

        function shareUrl(fileId) {
            return `${CONFIG.API_ENDPOINT}/f/${encodeURIComponent(fileId)}`;
        }

        function debounce(fn, ms) {
            let t;
            return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
        }

        // ---------- Toasts & modal ----------

        function toast(message, type = 'success', timeout = 3500) {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.setAttribute('role', type === 'error' ? 'alert' : 'status');
            el.innerHTML = '<span class="dot"></span><span></span>';
            el.lastChild.textContent = message;
            $('toasts').appendChild(el);
            setTimeout(() => {
                el.classList.add('leaving');
                setTimeout(() => el.remove(), 200);
            }, timeout);
        }

        // Returns a promise resolving to true/false. Pass `onConfirm` to keep the
        // modal open while async work runs; it receives a progress setter.
        function confirmDialog({ title, message, confirmLabel = 'Delete', onConfirm }) {
            return new Promise((resolve) => {
                const previousFocus = document.activeElement;
                const backdrop = document.createElement('div');
                backdrop.className = 'modal-backdrop';
                backdrop.innerHTML = `
                    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage">
                        <h2 id="modalTitle"></h2>
                        <p id="modalMessage"></p>
                        <div class="progress" hidden><span></span></div>
                        <div class="modal-actions">
                            <button class="btn btn-ghost" data-action="cancel">Cancel</button>
                            <button class="btn btn-danger" data-action="confirm"></button>
                        </div>
                    </div>`;
                backdrop.querySelector('h2').textContent = title;
                backdrop.querySelector('p').textContent = message;
                const confirmBtn = backdrop.querySelector('[data-action="confirm"]');
                const cancelBtn = backdrop.querySelector('[data-action="cancel"]');
                confirmBtn.textContent = confirmLabel;
                document.body.appendChild(backdrop);
                cancelBtn.focus();

                let busy = false;
                const close = (result) => {
                    document.removeEventListener('keydown', onKey, true);
                    backdrop.remove();
                    if (previousFocus && previousFocus.focus) previousFocus.focus();
                    resolve(result);
                };
                const onKey = (e) => {
                    if (e.key === 'Escape' && !busy) { e.stopPropagation(); close(false); }
                    if (e.key === 'Tab') {
                        // Keep focus inside the dialog
                        const items = [cancelBtn, confirmBtn].filter(b => !b.disabled);
                        const idx = items.indexOf(document.activeElement);
                        e.preventDefault();
                        items[(idx + (e.shiftKey ? -1 : 1) + items.length) % items.length]?.focus();
                    }
                };
                document.addEventListener('keydown', onKey, true);
                backdrop.addEventListener('click', (e) => { if (e.target === backdrop && !busy) close(false); });
                cancelBtn.addEventListener('click', () => close(false));
                confirmBtn.addEventListener('click', async () => {
                    if (!onConfirm) return close(true);
                    busy = true;
                    confirmBtn.disabled = cancelBtn.disabled = true;
                    confirmBtn.textContent = 'Deleting…';
                    const bar = backdrop.querySelector('.progress');
                    const setProgress = (fraction) => {
                        bar.hidden = false;
                        bar.firstElementChild.style.width = `${Math.round(fraction * 100)}%`;
                    };
                    try {
                        await onConfirm(setProgress);
                    } finally {
                        close(true);
                    }
                });
            });
        }

        // Bottom sheet with a file's details and every action; the phone layout
        // hides the per-row buttons behind this.
        function openDetails(fileId) {
            const file = findFile(fileId);
            if (!file) return;
            const previousFocus = document.activeElement;
            const category = getFileCategory(file.contentType);
            const ext = getExtension(file.originalName);
            const backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop';
            backdrop.innerHTML = `
                <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
                    <div class="sheet-head">
                        <div class="file-icon bg-${category}" aria-hidden="true">${escapeHtml(ext && ext.length <= 4 ? ext : CATEGORIES[category].short)}</div>
                        <h2 id="sheetTitle">${escapeHtml(file.originalName || 'Untitled')}</h2>
                    </div>
                    <dl class="sheet-details">
                        <dt>Type</dt><dd>${escapeHtml(file.contentType || 'Unknown')}</dd>
                        <dt>Size</dt><dd>${formatFileSize(file.fileSize || 0)}</dd>
                        <dt>Downloads</dt><dd>${(file.downloadCount || 0).toLocaleString()}</dd>
                        <dt>Uploaded</dt><dd>${escapeHtml(formatDate(file.uploadDate))}</dd>
                        <dt>File ID</dt><dd><code>${escapeHtml(file.fileId)}</code></dd>
                    </dl>
                    <div class="sheet-actions">
                        <button class="btn btn-ghost" data-sheet="view">${ICONS.view} Open</button>
                        <button class="btn btn-ghost" data-sheet="copy">${ICONS.copy} Copy link</button>
                        <button class="btn btn-ghost" data-sheet="download">${ICONS.download} Download</button>
                        <button class="btn btn-ghost" data-sheet="select">${state.selected.has(fileId) ? 'Deselect' : 'Select'}</button>
                        <button class="btn btn-danger" data-sheet="delete">${ICONS.delete} Delete</button>
                        <button class="btn btn-ghost sheet-close" data-sheet="close">Close</button>
                    </div>
                </div>`;
            document.body.appendChild(backdrop);
            backdrop.querySelector('[data-sheet="close"]').focus();

            const close = () => {
                document.removeEventListener('keydown', onKey, true);
                backdrop.remove();
                if (previousFocus && previousFocus.isConnected) previousFocus.focus();
            };
            const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
            document.addEventListener('keydown', onKey, true);
            backdrop.addEventListener('click', (e) => {
                if (e.target === backdrop) return close();
                const btn = e.target.closest('[data-sheet]');
                if (!btn) return;
                const action = btn.dataset.sheet;
                close();
                switch (action) {
                    case 'view': window.open(shareUrl(fileId), '_blank', 'noopener'); break;
                    case 'copy': copyLink(fileId); break;
                    case 'download': downloadFile(fileId); break;
                    case 'delete': deleteOne(fileId); break;
                    case 'select':
                        if (state.selected.has(fileId)) state.selected.delete(fileId);
                        else state.selected.add(fileId);
                        updateSelectionUI();
                        break;
                }
            });
        }

        // ---------- API ----------

        class AuthError extends Error {}

        async function api(path, options = {}) {
            const response = await fetch(`${CONFIG.API_ENDPOINT}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Password': state.password,
                    ...(options.headers || {})
                }
            });
            if (response.status === 401) {
                throw new AuthError('Invalid admin password');
            }
            return response;
        }

        async function fetchFiles() {
            const response = await api('/f/admin/files');
            if (!response.ok) throw new Error(`API error: ${response.status} ${response.statusText}`);
            const data = await response.json();
            state.bucketSize = typeof data.bucketSize === 'number' ? data.bucketSize : null;
            return Array.isArray(data.files) ? data.files : [];
        }

        async function deleteFileRequest(fileId) {
            const response = await api(`/f/admin/delete/${encodeURIComponent(fileId)}`, { method: 'DELETE' });
            if (!response.ok) {
                const body = await response.json().catch(() => ({}));
                throw new Error(body.error || `Delete failed: ${response.status}`);
            }
        }

        // ---------- Auth ----------

        function readStoredPassword() {
            try {
                return sessionStorage.getItem(CONFIG.STORAGE_KEY) || localStorage.getItem(CONFIG.STORAGE_KEY);
            } catch { return null; }
        }

        function storePassword(password, remember) {
            try {
                sessionStorage.setItem(CONFIG.STORAGE_KEY, password);
                if (remember) localStorage.setItem(CONFIG.STORAGE_KEY, password);
            } catch { /* storage unavailable: stay signed in for this page only */ }
        }

        function clearStoredPassword() {
            try {
                sessionStorage.removeItem(CONFIG.STORAGE_KEY);
                localStorage.removeItem(CONFIG.STORAGE_KEY);
            } catch { /* ignore */ }
        }

        function showLogin(message = '') {
            state.password = null;
            $('adminContent').hidden = true;
            $('loginScreen').hidden = false;
            $('loginError').textContent = message;
            $('passwordInput').value = '';
            $('passwordInput').focus();
        }

        function showDashboard() {
            $('loginScreen').hidden = true;
            $('adminContent').hidden = false;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const password = $('passwordInput').value;
            if (!password) return;
            const button = $('loginButton');
            button.disabled = true;
            button.textContent = 'Signing in…';
            $('loginError').textContent = '';
            state.password = password;
            try {
                state.files = await fetchFiles();
                storePassword(password, $('rememberMe').checked);
                showDashboard();
                onDataLoaded();
            } catch (error) {
                state.password = null;
                $('loginError').textContent = error instanceof AuthError
                    ? 'Incorrect password. Please try again.'
                    : `Could not reach the API: ${error.message}`;
                $('passwordInput').select();
            } finally {
                button.disabled = false;
                button.textContent = 'Sign in';
            }
        }

        function logout() {
            clearStoredPassword();
            state.files = [];
            state.selected.clear();
            document.body.classList.remove('has-selection');
            showLogin();
        }

        // ---------- Data loading ----------

        async function refreshData({ silent = false } = {}) {
            if (state.loading) return;
            state.loading = true;
            const button = $('refreshButton');
            button.disabled = true;
            button.querySelector('svg').classList.add('spin');
            if (!state.files.length) renderSkeleton();

            try {
                state.files = await fetchFiles();
                onDataLoaded();
                if (!silent) toast('Files refreshed', 'info', 2000);
            } catch (error) {
                if (error instanceof AuthError) {
                    clearStoredPassword();
                    showLogin('Your session has expired. Please sign in again.');
                    return;
                }
                console.error('Error loading files:', error);
                if (state.files.length) {
                    toast(`Refresh failed: ${error.message}`, 'error');
                } else {
                    renderError(error.message);
                }
            } finally {
                state.loading = false;
                button.disabled = false;
                button.querySelector('svg').classList.remove('spin');
            }
        }

        function onDataLoaded() {
            // Drop selections for files that no longer exist
            const ids = new Set(state.files.map(f => f.fileId));
            for (const id of state.selected) if (!ids.has(id)) state.selected.delete(id);
            $('lastUpdated').textContent = `Updated ${new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
            updateStats();
            applyFilters();
        }

        // ---------- Stats ----------

        function updateStats() {
            const files = state.files;
            const totalSize = files.reduce((sum, f) => sum + (f.fileSize || 0), 0);
            const totalDownloads = files.reduce((sum, f) => sum + (f.downloadCount || 0), 0);
            const todayStr = new Date().toDateString();
            const weekAgo = Date.now() - 7 * 86400000;
            const today = files.filter(f => f.uploadDate && new Date(f.uploadDate).toDateString() === todayStr);
            const week = files.filter(f => f.uploadDate && new Date(f.uploadDate).getTime() >= weekAgo);
            const neverDownloaded = files.filter(f => !f.downloadCount).length;
            const top = files.reduce((best, f) => (f.downloadCount || 0) > (best?.downloadCount || 0) ? f : best, null);

            $('totalFiles').textContent = files.length.toLocaleString();
            $('totalFilesSub').textContent = files.length ? `${neverDownloaded.toLocaleString()} never downloaded` : ' ';

            // Prefer the bucket size reported by the API; it includes orphaned objects
            $('totalSize').textContent = formatFileSize(state.bucketSize ?? totalSize);
            $('totalSizeSub').textContent = files.length ? `Avg ${formatFileSize(totalSize / files.length)} per file` : ' ';

            $('totalDownloads').textContent = totalDownloads.toLocaleString();
            $('totalDownloadsSub').textContent = top && top.downloadCount ? `Top: ${top.originalName || top.fileId}` : ' ';
            $('totalDownloadsSub').title = top?.originalName || '';

            $('todayUploads').textContent = today.length.toLocaleString();
            $('todayUploadsSub').textContent = `${week.length.toLocaleString()} in the last 7 days · ${formatFileSize(today.reduce((s, f) => s + (f.fileSize || 0), 0))} today`;

            renderBreakdown(totalSize);
        }

        function renderBreakdown(totalSize) {
            const section = $('breakdown');
            if (!totalSize) { section.hidden = true; return; }
            const byType = {};
            for (const key of Object.keys(CATEGORIES)) byType[key] = { size: 0, count: 0 };
            for (const f of state.files) {
                const cat = getFileCategory(f.contentType);
                byType[cat].size += f.fileSize || 0;
                byType[cat].count++;
            }
            const entries = Object.entries(byType).filter(([, v]) => v.count > 0).sort((a, b) => b[1].size - a[1].size);
            $('breakdownTotal').textContent = `${formatFileSize(totalSize)} across ${state.files.length.toLocaleString()} files`;
            $('breakdownBar').innerHTML = entries.map(([cat, v]) =>
                `<span class="bg-${cat}" style="flex:${v.size || 0.0001}" title="${CATEGORIES[cat].label}: ${formatFileSize(v.size)}"></span>`
            ).join('');
            $('breakdownLegend').innerHTML = entries.map(([cat, v]) => `
                <button class="legend-item" data-filter-type="${cat}" title="Show only ${CATEGORIES[cat].label.toLowerCase()}">
                    <span class="legend-dot bg-${cat}"></span>
                    ${CATEGORIES[cat].label} · ${v.count.toLocaleString()} · ${formatFileSize(v.size)} (${Math.round(v.size / totalSize * 100)}%)
                </button>`).join('');
            section.hidden = false;
        }

        // ---------- Filtering, sorting, paging ----------

        function matchesDate(uploadDate, filter) {
            if (!filter) return true;
            if (!uploadDate) return false;
            const date = new Date(uploadDate);
            const age = Date.now() - date.getTime();
            switch (filter) {
                case 'today': return date.toDateString() === new Date().toDateString();
                case 'week': return age <= 7 * 86400000;
                case 'month': return age <= 30 * 86400000;
                case 'older': return age > 30 * 86400000;
                default: return true;
            }
        }

        function sortFiles(files) {
            const { field, direction } = state.sort;
            const dir = direction === 'asc' ? 1 : -1;
            const value = (f) => {
                switch (field) {
                    case 'fileSize':
                    case 'downloadCount': return f[field] || 0;
                    case 'uploadDate': return f.uploadDate ? new Date(f.uploadDate).getTime() : 0;
                    case 'contentType': return getFileCategory(f.contentType);
                    default: return (f[field] || '').toLowerCase();
                }
            };
            return [...files].sort((a, b) => {
                const av = value(a), bv = value(b);
                const cmp = typeof av === 'string' ? av.localeCompare(bv, undefined, { numeric: true }) : av - bv;
                return cmp * dir;
            });
        }

        function applyFilters({ resetPage = false } = {}) {
            const term = $('searchInput').value.trim().toLowerCase();
            const type = $('typeFilter').value;
            const date = $('dateFilter').value;

            state.filtered = sortFiles(state.files.filter(f =>
                (!term || (f.originalName || '').toLowerCase().includes(term) || (f.fileId || '').toLowerCase().includes(term)) &&
                (!type || getFileCategory(f.contentType) === type) &&
                matchesDate(f.uploadDate, date)
            ));

            if (resetPage) state.page = 1;
            const pages = totalPages();
            if (state.page > pages) state.page = pages;
            renderFiles();
        }

        function totalPages() {
            return state.pageSize ? Math.max(1, Math.ceil(state.filtered.length / state.pageSize)) : 1;
        }

        function currentPageFiles() {
            if (!state.pageSize) return state.filtered;
            const start = (state.page - 1) * state.pageSize;
            return state.filtered.slice(start, start + state.pageSize);
        }

        function hasActiveFilters() {
            return Boolean($('searchInput').value.trim() || $('typeFilter').value || $('dateFilter').value);
        }

        function clearFilters() {
            $('searchInput').value = '';
            $('typeFilter').value = '';
            $('dateFilter').value = '';
            applyFilters({ resetPage: true });
        }

        function setSort(field) {
            if (state.sort.field === field) {
                state.sort.direction = state.sort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                // Numbers and dates are most useful largest/newest first
                state.sort = { field, direction: ['fileSize', 'downloadCount', 'uploadDate'].includes(field) ? 'desc' : 'asc' };
            }
            updateSortIndicators();
            applyFilters();
        }

        function updateSortIndicators() {
            document.querySelectorAll('.sortable-header').forEach(btn => {
                const field = btn.dataset.sort;
                const active = field === state.sort.field;
                const indicator = btn.querySelector('.sort-indicator');
                indicator.textContent = active ? (state.sort.direction === 'asc' ? '↑' : '↓') : '⇅';
                indicator.classList.toggle('active', active);
                btn.setAttribute('aria-sort', active ? (state.sort.direction === 'asc' ? 'ascending' : 'descending') : 'none');
            });
            const mobileValue = `${state.sort.field}:${state.sort.direction}`;
            const mobileSort = $('mobileSort');
            if ([...mobileSort.options].some(o => o.value === mobileValue)) mobileSort.value = mobileValue;
        }

        // ---------- Rendering ----------

        function renderSkeleton() {
            $('tableFooter').hidden = true;
            $('resultSummary').textContent = 'Loading files…';
            $('filesContainer').innerHTML = Array.from({ length: 6 }, () => `
                <div class="row-grid file-row skeleton-row" aria-hidden="true">
                    <div class="sk" style="width:16px"></div>
                    <div class="sk" style="width:60%"></div>
                    <div class="sk col-type" style="width:50px"></div>
                    <div class="sk col-size"></div>
                    <div class="sk col-downloads"></div>
                    <div class="sk col-date"></div>
                    <div class="sk"></div>
                </div>`).join('');
        }

        function renderError(message) {
            $('tableFooter').hidden = true;
            $('resultSummary').textContent = 'Could not load files';
            $('filesContainer').innerHTML = `
                <div class="error-state">
                    <h3>Could not load files</h3>
                    <p>${escapeHtml(message)}</p>
                    <button class="btn btn-primary" data-action="retry">Try again</button>
                </div>`;
        }

        function renderFiles() {
            const container = $('filesContainer');
            const pageFiles = currentPageFiles();

            if (state.filtered.length === 0) {
                const filtered = hasActiveFilters();
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>${filtered ? 'No files match your filters' : 'No files yet'}</h3>
                        <p>${filtered ? 'Try a different search term or clear the filters.' : 'Uploaded files will appear here.'}</p>
                        ${filtered ? '<button class="btn btn-ghost" data-action="clear-filters">Clear filters</button>' : ''}
                    </div>`;
            } else {
                container.innerHTML = pageFiles.map(renderRow).join('');
            }

            renderSummary();
            renderPager();
            syncSelectAll();
        }

        function renderRow(file) {
            const id = escapeHtml(file.fileId);
            const name = escapeHtml(file.originalName || 'Untitled');
            const category = getFileCategory(file.contentType);
            const ext = getExtension(file.originalName);
            const iconText = escapeHtml(ext && ext.length <= 4 ? ext : CATEGORIES[category].short);
            const selected = state.selected.has(file.fileId);
            const downloads = (file.downloadCount || 0).toLocaleString();

            return `
                <div class="row-grid file-row${selected ? ' selected' : ''}" data-id="${id}">
                    <input type="checkbox" class="checkbox" data-action="select" ${selected ? 'checked' : ''} aria-label="Select ${name}">
                    <div class="file-name">
                        <div class="file-icon bg-${category}" aria-hidden="true">${iconText}</div>
                        <div class="file-name-text">
                            <strong title="${name}">${name}</strong>
                            <span class="file-id" title="${escapeHtml(file.contentType || '')}">${id}</span>
                        </div>
                    </div>
                    <span class="file-type ${category} col-type">${category}</span>
                    <div class="cell num col-size">${formatFileSize(file.fileSize || 0)}</div>
                    <div class="cell num col-downloads">${downloads}</div>
                    <div class="cell col-date" title="${escapeHtml(formatDate(file.uploadDate))}">
                        ${escapeHtml(formatRelative(file.uploadDate) || 'Unknown')}
                        <small>${escapeHtml(file.uploadDate ? new Date(file.uploadDate).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '')}</small>
                    </div>
                    <div class="mobile-meta">${formatFileSize(file.fileSize || 0)} · ${downloads} download${file.downloadCount === 1 ? '' : 's'} · ${escapeHtml(formatRelative(file.uploadDate))}</div>
                    <div class="file-actions">
                        <button class="action-btn view" data-action="view" title="Open share page" aria-label="Open share page for ${name}">${ICONS.view}</button>
                        <button class="action-btn copy" data-action="copy" title="Copy share link" aria-label="Copy share link for ${name}">${ICONS.copy}</button>
                        <button class="action-btn download" data-action="download" title="Download" aria-label="Download ${name}">${ICONS.download}</button>
                        <button class="action-btn delete" data-action="delete" title="Delete" aria-label="Delete ${name}">${ICONS.delete}</button>
                        <button class="action-btn more mobile-only" data-action="details" aria-label="Actions for ${name}">${ICONS.more}</button>
                    </div>
                </div>`;
        }

        function renderSummary() {
            const total = state.files.length;
            const shown = state.filtered.length;
            const selectedCount = state.selected.size;
            const toolbar = $('tableToolbar');
            const summary = $('resultSummary');

            toolbar.classList.toggle('has-selection', selectedCount > 0);
            $('selectionActions').hidden = selectedCount === 0;
            document.body.classList.toggle('has-selection', selectedCount > 0);

            if (selectedCount > 0) {
                const selectedSize = state.files
                    .filter(f => state.selected.has(f.fileId))
                    .reduce((s, f) => s + (f.fileSize || 0), 0);
                const allFilteredSelected = shown > 0 && state.filtered.every(f => state.selected.has(f.fileId));
                summary.innerHTML = `<strong>${selectedCount.toLocaleString()}</strong> selected (${formatFileSize(selectedSize)})` +
                    (!allFilteredSelected && shown > currentPageFiles().length
                        ? ` · <button class="link-btn" data-action="select-all-filtered">Select all ${shown.toLocaleString()} matching</button>`
                        : '');
            } else if (shown === total) {
                summary.textContent = `${total.toLocaleString()} file${total === 1 ? '' : 's'}`;
            } else {
                summary.innerHTML = `${shown.toLocaleString()} of ${total.toLocaleString()} files · <button class="link-btn" data-action="clear-filters">Clear filters</button>`;
            }
        }

        function renderPager() {
            const footer = $('tableFooter');
            if (!state.filtered.length) { footer.hidden = true; return; }
            footer.hidden = false;
            const pages = totalPages();
            const start = state.pageSize ? (state.page - 1) * state.pageSize + 1 : 1;
            const end = state.pageSize ? Math.min(state.page * state.pageSize, state.filtered.length) : state.filtered.length;
            $('pageInfo').textContent = `Showing ${start.toLocaleString()}–${end.toLocaleString()} of ${state.filtered.length.toLocaleString()}`;
            $('prevPage').disabled = state.page <= 1;
            $('nextPage').disabled = state.page >= pages;
        }

        function syncSelectAll() {
            const pageFiles = currentPageFiles();
            const selectedOnPage = pageFiles.filter(f => state.selected.has(f.fileId)).length;
            const selectAll = $('selectAll');
            selectAll.checked = pageFiles.length > 0 && selectedOnPage === pageFiles.length;
            selectAll.indeterminate = selectedOnPage > 0 && selectedOnPage < pageFiles.length;
            selectAll.disabled = pageFiles.length === 0;
            const mobile = $('selectAllMobile');
            mobile.checked = selectAll.checked;
            mobile.indeterminate = selectAll.indeterminate;
            mobile.disabled = selectAll.disabled;
        }

        function updateSelectionUI() {
            document.querySelectorAll('#filesContainer .file-row[data-id]').forEach(row => {
                const selected = state.selected.has(row.dataset.id);
                row.classList.toggle('selected', selected);
                const cb = row.querySelector('[data-action="select"]');
                if (cb) cb.checked = selected;
            });
            renderSummary();
            syncSelectAll();
        }

        // ---------- Actions ----------

        function findFile(fileId) {
            return state.files.find(f => f.fileId === fileId);
        }

        function removeFiles(ids) {
            const removed = new Set(ids);
            const removedSize = state.files.filter(f => removed.has(f.fileId)).reduce((s, f) => s + (f.fileSize || 0), 0);
            state.files = state.files.filter(f => !removed.has(f.fileId));
            for (const id of ids) state.selected.delete(id);
            if (state.bucketSize != null) state.bucketSize = Math.max(0, state.bucketSize - removedSize);
            updateStats();
            applyFilters();
        }

        async function copyLink(fileId) {
            const url = shareUrl(fileId);
            try {
                await navigator.clipboard.writeText(url);
                toast('Share link copied');
            } catch {
                window.prompt('Copy this link:', url);
            }
        }

        async function downloadFile(fileId, button) {
            const file = findFile(fileId);
            const fileName = file?.originalName || 'file';
            if (button) button.disabled = true;
            try {
                // The admin endpoint either redirects to a signed URL or returns { downloadUrl }.
                // A cross-origin redirect is opaque to fetch, so we read the JSON form when we can.
                const response = await api(`/f/admin/download/${encodeURIComponent(fileId)}`, {
                    method: 'GET',
                    redirect: 'manual'
                });

                let downloadUrl = null;
                if (response.ok) {
                    const result = await response.json().catch(() => ({}));
                    downloadUrl = result.downloadUrl || null;
                } else if (response.status >= 300 && response.status < 400) {
                    downloadUrl = response.headers.get('Location');
                }

                if (downloadUrl) {
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = fileName;
                    a.rel = 'noopener';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    toast(`Download started: ${fileName}`);
                    return;
                }

                // Fall back to the public share page, which serves the file
                window.open(shareUrl(fileId), '_blank', 'noopener');
                toast('Opened share page to download', 'info');
            } catch (error) {
                if (error instanceof AuthError) return logout();
                console.error('Download error:', error);
                toast(`Download failed: ${error.message}`, 'error');
            } finally {
                if (button) button.disabled = false;
            }
        }

        async function deleteOne(fileId) {
            const file = findFile(fileId);
            const name = file?.originalName || fileId;
            const confirmed = await confirmDialog({
                title: 'Delete file?',
                message: `"${name}" will be permanently removed from storage and the database. Anyone with the share link will lose access. This cannot be undone.`,
                onConfirm: async () => {
                    try {
                        await deleteFileRequest(fileId);
                        removeFiles([fileId]);
                        toast(`Deleted ${name}`);
                    } catch (error) {
                        if (error instanceof AuthError) return logout();
                        console.error('Delete error:', error);
                        toast(`Could not delete ${name}: ${error.message}`, 'error', 6000);
                    }
                }
            });
            return confirmed;
        }

        async function deleteSelected() {
            const ids = [...state.selected];
            if (!ids.length) return;
            const size = state.files.filter(f => state.selected.has(f.fileId)).reduce((s, f) => s + (f.fileSize || 0), 0);

            await confirmDialog({
                title: `Delete ${ids.length.toLocaleString()} file${ids.length === 1 ? '' : 's'}?`,
                message: `${formatFileSize(size)} will be permanently removed. Share links for these files will stop working. This cannot be undone.`,
                confirmLabel: `Delete ${ids.length.toLocaleString()}`,
                onConfirm: async (setProgress) => {
                    const deleted = [];
                    const failed = [];
                    let done = 0;
                    let authFailed = false;
                    const queue = [...ids];

                    // Run a few deletes in parallel instead of one at a time
                    const worker = async () => {
                        while (queue.length && !authFailed) {
                            const id = queue.shift();
                            try {
                                await deleteFileRequest(id);
                                deleted.push(id);
                            } catch (error) {
                                if (error instanceof AuthError) authFailed = true;
                                failed.push(id);
                                console.error(`Failed to delete ${id}:`, error);
                            }
                            setProgress(++done / ids.length);
                        }
                    };
                    await Promise.all(Array.from({ length: Math.min(CONFIG.DELETE_CONCURRENCY, ids.length) }, worker));

                    removeFiles(deleted);
                    if (authFailed) return logout();
                    if (failed.length === 0) {
                        toast(`Deleted ${deleted.length.toLocaleString()} file${deleted.length === 1 ? '' : 's'}`);
                    } else {
                        // Leave the failures selected so they can be retried
                        toast(`Deleted ${deleted.length}, ${failed.length} failed. Failed files are still selected.`, 'error', 7000);
                    }
                }
            });
        }

        function exportCsv() {
            const rows = [['File ID', 'Name', 'Content type', 'Category', 'Size (bytes)', 'Downloads', 'Uploaded']];
            for (const f of state.filtered) {
                rows.push([f.fileId, f.originalName || '', f.contentType || '', getFileCategory(f.contentType),
                    f.fileSize || 0, f.downloadCount || 0, f.uploadDate || '']);
            }
            const csv = rows.map(r => r.map(v => {
                let s = String(v);
                // Neutralise spreadsheet formula injection from uploaded file names
                if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
                return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
            }).join(',')).join('\r\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dashfiles-${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            toast(`Exported ${state.filtered.length.toLocaleString()} files`);
        }

        // ---------- Theme ----------

        function applyTheme(theme) {
            if (theme) document.documentElement.dataset.theme = theme;
            else delete document.documentElement.dataset.theme;
        }

        function toggleTheme() {
            const current = document.documentElement.dataset.theme ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            try { localStorage.setItem(CONFIG.THEME_KEY, next); } catch { /* ignore */ }
        }

        // ---------- Event wiring ----------

        function setupEventListeners() {
            $('loginForm').addEventListener('submit', handleLogin);
            $('logoutButton').addEventListener('click', logout);
            $('refreshButton').addEventListener('click', () => refreshData());
            $('themeButton').addEventListener('click', toggleTheme);
            $('exportButton').addEventListener('click', exportCsv);
            $('deleteSelectedButton').addEventListener('click', deleteSelected);
            $('clearSelectionButton').addEventListener('click', () => { state.selected.clear(); updateSelectionUI(); });

            $('searchInput').addEventListener('input', debounce(() => applyFilters({ resetPage: true }), 150));
            $('typeFilter').addEventListener('change', () => applyFilters({ resetPage: true }));
            $('dateFilter').addEventListener('change', () => applyFilters({ resetPage: true }));

            $('pageSize').addEventListener('change', (e) => {
                state.pageSize = Number(e.target.value);
                state.page = 1;
                renderFiles();
            });
            $('prevPage').addEventListener('click', () => { state.page--; renderFiles(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
            $('nextPage').addEventListener('click', () => { state.page++; renderFiles(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

            document.querySelectorAll('.sortable-header').forEach(btn =>
                btn.addEventListener('click', () => setSort(btn.dataset.sort)));

            $('mobileSort').addEventListener('change', (e) => {
                const [field, direction] = e.target.value.split(':');
                state.sort = { field, direction };
                updateSortIndicators();
                applyFilters();
            });

            $('selectAllMobile').addEventListener('change', (e) => {
                $('selectAll').checked = e.target.checked;
                $('selectAll').dispatchEvent(new Event('change'));
            });

            $('selectAll').addEventListener('change', (e) => {
                for (const f of currentPageFiles()) {
                    if (e.target.checked) state.selected.add(f.fileId);
                    else state.selected.delete(f.fileId);
                }
                updateSelectionUI();
            });

            $('breakdownLegend').addEventListener('click', (e) => {
                const item = e.target.closest('[data-filter-type]');
                if (!item) return;
                const type = item.dataset.filterType;
                $('typeFilter').value = $('typeFilter').value === type ? '' : type;
                applyFilters({ resetPage: true });
            });

            // Delegated handlers for row actions, summary links and empty/error states
            document.querySelector('.table-wrap').addEventListener('click', (e) => {
                const target = e.target.closest('[data-action]');
                if (!target) return;
                const action = target.dataset.action;
                const row = target.closest('.file-row[data-id]');
                const fileId = row?.dataset.id;

                switch (action) {
                    case 'select':
                        if (target.checked) state.selected.add(fileId);
                        else state.selected.delete(fileId);
                        updateSelectionUI();
                        break;
                    case 'view': window.open(shareUrl(fileId), '_blank', 'noopener'); break;
                    case 'copy': copyLink(fileId); break;
                    case 'download': downloadFile(fileId, target); break;
                    case 'delete': deleteOne(fileId); break;
                    case 'details': openDetails(fileId); break;
                    case 'clear-filters': clearFilters(); break;
                    case 'retry': refreshData(); break;
                    case 'select-all-filtered':
                        state.filtered.forEach(f => state.selected.add(f.fileId));
                        updateSelectionUI();
                        break;
                }
            });

            // Phone layout: tapping a row opens its details sheet
            const mobileQuery = matchMedia('(max-width: 640px)');
            $('filesContainer').addEventListener('click', (e) => {
                if (!mobileQuery.matches || e.target.closest('[data-action], button, input, a')) return;
                const row = e.target.closest('.file-row[data-id]');
                if (!row) return;
                // The checkbox itself is small; treat the whole left gutter as its tap target
                if (e.clientX - row.getBoundingClientRect().left < 48) {
                    const id = row.dataset.id;
                    if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
                    updateSelectionUI();
                    return;
                }
                openDetails(row.dataset.id);
            });

            // Shift-click a checkbox to select a range on the current page
            let lastChecked = null;
            $('filesContainer').addEventListener('click', (e) => {
                const cb = e.target.closest('[data-action="select"]');
                if (!cb) return;
                const boxes = [...$('filesContainer').querySelectorAll('[data-action="select"]')];
                if (e.shiftKey && lastChecked && boxes.includes(lastChecked)) {
                    const [a, b] = [boxes.indexOf(lastChecked), boxes.indexOf(cb)].sort((x, y) => x - y);
                    for (const box of boxes.slice(a, b + 1)) {
                        const id = box.closest('.file-row').dataset.id;
                        if (cb.checked) state.selected.add(id); else state.selected.delete(id);
                    }
                    updateSelectionUI();
                }
                lastChecked = cb;
            });

            // Keyboard shortcuts: "/" focuses search, "r" refreshes, Esc clears search/selection
            document.addEventListener('keydown', (e) => {
                if ($('adminContent').hidden || document.querySelector('.modal-backdrop')) return;
                const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) &&
                    document.activeElement.type !== 'checkbox';
                if (e.key === '/' && !typing) {
                    e.preventDefault();
                    $('searchInput').focus();
                } else if (e.key.toLowerCase() === 'r' && !typing && !e.metaKey && !e.ctrlKey) {
                    refreshData();
                } else if (e.key === 'Escape') {
                    if (document.activeElement === $('searchInput') && $('searchInput').value) {
                        $('searchInput').value = '';
                        applyFilters({ resetPage: true });
                    } else if (state.selected.size) {
                        state.selected.clear();
                        updateSelectionUI();
                    }
                }
            });
        }

        // ---------- Init ----------

        document.addEventListener('DOMContentLoaded', async () => {
            try { applyTheme(localStorage.getItem(CONFIG.THEME_KEY)); } catch { /* ignore */ }
            setupEventListeners();
            updateSortIndicators();

            const stored = readStoredPassword();
            if (!stored) return showLogin();

            state.password = stored;
            showDashboard();
            await refreshData({ silent: true });
        });
    </script>
</body>
</html>
